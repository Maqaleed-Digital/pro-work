# RETIRED AS A DEPLOYMENT PATH — WC-011, 12 September 2026.
#
# This workflow no longer deploys anything, and can no longer be made to try.
#
# WHAT IT WAS
# -----------
# It was named "Production Deployment", was manually dispatchable with a `production`
# option, and on a `v*` tag would run:
#     aws ecs update-service --cluster prowork-production --service prowork-api \
#                            --force-new-deployment        (region default us-east-1)
# Measured 12 Sep 2026: `us-east-1` holds ZERO ECS clusters and no `prowork-*` cluster
# exists in any region. Live WorkCaptain is `workcaptain-production` / `workcaptain` in
# `eu-central-1`.
#
# It also could not have promoted a new image even against correct names:
# `--force-new-deployment` redeploys the task definition the service ALREADY references.
# It never registers a revision carrying a newly built image.
#
# Across its last 15 runs, every single one reported run-level SUCCESS with both deploy
# jobs SKIPPED. Nothing was broken and nothing lied — it simply could not do what its name
# claimed, and reported success while not doing it. That is the harm: an operator under
# pressure reads a green "Production Deployment" and concludes a deployment happened.
#
# WHAT REPLACED IT
# ----------------
# DL-WC-RELEASE-MECH-001 (Ratified with amendment, 12 Sep 2026) — the WC-007 two-stage path:
#   approved source SHA -> Stage A build/publish -> validated release manifest
#   -> immutable GHCR digest -> guarded candidate from the LIVE task definition
#   -> explicit registered revision -> explicit service update -> running-digest witness
# Production ECS mutation is a Sponsor-gated G1 act, deliberately NOT a workflow.
# Terraform is not release authority. `--force-new-deployment` is not application release
# authority — it is the credential-rotation placement instrument (WC-003/WC-004).
#
# WHY THE NAME SURVIVES
# ---------------------
# `.github/workflows/web-assurance.yml` triggers on
# `workflow_run: workflows: ["Production Deployment"]`, and
# `tests/security/workflow_trust_boundary.test.js` asserts that exact string. web-assurance
# is generated by the MAQ-WAAP-001 H4-C factory and is not hand-edited here, so renaming
# would sever a live trigger chain and break a control test from outside its owning lane.
# The NAME is therefore retained.
#
# DO NOT ADD `run-name:` TO THIS FILE.
# Measured the hard way on 2026-09-12: a `run-name` was added here to state the truth in the
# Actions UI, and GitHub populated `workflow_run.name` from it. web-assurance's predicate
# `github.event.workflow_run.name == 'Production Deployment'` then evaluated FALSE and the
# assurance job SKIPPED — severing the very trigger chain this retirement was designed to
# preserve. `run-name` is not cosmetic here; it is load-bearing on a downstream control.
# tests/security/release_path_guard.test.js asserts its absence.
#
# The honest signal lives in the JOB name instead, which is visible in the run without
# touching `workflow_run.name`.
#
# Removed here: workflow_dispatch, the `v*` tag trigger, and the build / deploy-staging /
# deploy-production jobs in full — with them every AWS credential, region and cluster
# reference. What remains is the post-merge test job that web-assurance keys on.
name: Production Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  post-merge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test
