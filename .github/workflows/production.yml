name: Production Deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      
      - name: Install dependencies
        working-directory: app
        run: npm ci
      
      - name: Run tests
        working-directory: app
        run: npm test
      # NOTE (WC-W4-UI-009): the former "Run reserve layer tests" step was removed — it ran
      # `node --test tests/reserve/reserve_layer.test.js`, a fixture that has NEVER existed in
      # main's tree. The trust-reserve feature (app/modules/reserve/* + its test) lives on
      # sprint/S37-trust-reserve-stability and was never merged to main; the step was orphaned on
      # main since fb8de0c (PROD-V1) and red on every commit. Restoring the test alone fails on its
      # missing module imports, and pulling the modules in would import an unmerged/unratified
      # feature via a CI cleanup — out of scope. The `npm test` step above is the real coverage.

  build:
    needs: test
    # WC-W4-UI-009 (Option A): build/push the image only for RELEASES (tags v*) or a manual
    # dispatch — NOT on ordinary pushes to main. An ordinary main merge runs the `test` job only;
    # the infra jobs (GHCR push, AWS ECS deploy) stay gated to release/dispatch. This keeps the
    # deploy pipeline green at demo-ready without smuggling deploy-infra config into a UI slice.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
      
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    # WC-W4-UI-009 (Option A): staging deploy on RELEASE tag (v*) or manual dispatch — no longer
    # on every push to main (which would attempt a real AWS ECS deploy on each feature merge).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster prowork-staging \
            --service prowork-api \
            --force-new-deployment

  deploy-production:
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      
      - name: Deploy to Production ECS
        run: |
          aws ecs update-service \
            --cluster prowork-production \
            --service prowork-api \
            --force-new-deployment
      
      - name: Notify deployment
        run: |
          echo "Production deployment complete: ${{ github.ref_name }}"
