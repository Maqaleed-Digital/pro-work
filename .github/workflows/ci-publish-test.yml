# WC-CI-PUBLISH-001 — disposable CI-publish proof.
# Proves GitHub Actions can build + push the WorkCaptain image to GHCR using the
# Actions identity (github.token) with NO human PAT. Manual-dispatch ONLY — never
# auto-triggers, never deploys, never cuts a v* tag. Publishes a DISPOSABLE test
# tag that must be deleted after the proof. Deliberately isolated from production.yml's
# deploy jobs so the proof touches the registry ONLY, not the deploy path.
name: ci-publish-test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Disposable test tag prefix (deleted after proof)'
        required: false
        default: 'citest'

permissions:
  contents: read
  packages: write   # the Actions GITHUB_TOKEN gets package write — NO human PAT

env:
  REGISTRY: ghcr.io
  IMAGE_PATH: maqaleed-digital/pro-work   # lowercase GHCR package path

jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (Actions identity — github.token, NOT a PAT)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build + push DISPOSABLE test image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:${{ github.event.inputs.tag }}-${{ github.run_id }}

      - name: Report publish identity (no human PAT in this path)
        # SECURITY BOUNDARY: `tag` is a workflow_dispatch input — event-supplied
        # text. Spliced into the script by the expression evaluator it was shell
        # source; carried in env: it is data bash never re-parses. The image
        # digest and the env values follow the same route so the rule is uniform.
        env:
          PUB_REGISTRY:   ${{ env.REGISTRY }}
          PUB_IMAGE_PATH: ${{ env.IMAGE_PATH }}
          PUB_TAG:        ${{ github.event.inputs.tag }}
          PUB_DIGEST:     ${{ steps.push.outputs.digest }}
        run: |
          echo "Published to ${PUB_REGISTRY}/${PUB_IMAGE_PATH}:${PUB_TAG}-${{ github.run_id }}"
          echo "Authenticated as Actions identity: ${{ github.actor }} via github.token"
          echo "Image digest: ${PUB_DIGEST}"
          echo "DISPOSABLE — delete this tag after the proof. NOT a v* tag; not in the deploy path."
