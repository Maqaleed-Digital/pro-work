name: secret-scan

# Branch-wide content scanning. Runs on every branch and every PR, plus a weekly
# sweep so a secret introduced on a stale branch does not wait for the next push.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — a secret removed in a later commit is still exposed

      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # DL-SCANNER-NEG-CONTROL-001: a scanner's "no leaks found" only supports
      # absence when that class has a class-specific positive control. This proves
      # the detector actually enumerates each class BEFORE its negative result is
      # read as evidence. Fixtures are synthetic, temp-only, and never written into
      # the repository or its history.
      #
      # Recorded because it is a live trap: AWS's published example key (the AKIA...
      # key ending in the word EXAMPLE) is ALLOWLISTED by gitleaks' default config,
      # so a control built on it silently never fires.
      - name: Scanner positive controls — the detector must fire on each class
        run: node scripts/scanner_positive_controls.js gitleaks

      - name: Scan full history
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 30
