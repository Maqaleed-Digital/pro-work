# A1 Engineering Assurance — product CI adapter · OBSERVE only · never blocking · Authority NONE
#
# This repository owns NO assurance semantics. Every predicate, the delta engine, the
# seal and the authority mapping live in the central repository and are pinned below by
# immutable commit. Nothing here is forked: PRODUCT_SPECIFIC_CORE_FORKS=0.
#
# Tranche A1 is credential-free assurance: every check is credential_class=NONE,
# observation_class=REPOSITORY, authorization_class=UNGATED. The App token minted below
# is infrastructure to READ the central runner (Contents:Read, that repository only) —
# it is never an observation credential, and this workflow holds no product credential.
#
# Automatic (witness-eligible) path: push to main. pull_request proves the wiring on the
# branch before merge and is branch evidence only. workflow_dispatch is DIAGNOSTIC — the
# runner stamps diagnostic_only=true and it can never close acceptance.
#
# This workflow deploys nothing, writes nothing, mutates no database and touches no
# product business logic. A1 findings are OBSERVATIONS and never fail the build (C-02).

name: a1-assurance

on:
  # push to main is the AUTOMATIC, witness-eligible path.
  push:
    branches: [main]
  # pull_request proves the wiring on the branch before merge. It is branch
  # evidence, not the automatic main witness.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  MWA_A1_REPO: Waheebow/maqaleed-web-assurance
  MWA_A1_RUNNER_REF: 3952da0b406bc3d41e81a0097d23fa476dad2464
  MWA_A1_PRODUCT: workcaptain

permissions:
  contents: read

concurrency:
  group: a1-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  a1:
    name: A1 assurance (security · api · data)
    if: github.repository == 'Maqaleed-Digital/pro-work'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout product at the exact commit under assurance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Presence is not validity. This gate answers only "is it set?"; the KEY_PREFLIGHT step
      # below classifies the MATERIAL before any token can exist, so a malformed key fails by
      # name here rather than as an opaque "Invalid keyData" from inside the mint action.
      - name: App credential presence gate
        env:
          APP_ID: ${{ vars.MWA_APP_ID }}
          KEY_PRESENT: ${{ secrets.MWA_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ "$KEY_PRESENT" != "true" ]; then
            echo "::error::MWA_APP_ID variable or MWA_APP_PRIVATE_KEY secret is absent — cannot read the central runner"
            exit 6
          fi
          echo "APP_CREDENTIAL_PRESENT=YES"

      # H4C-HARDEN-PEM-001. The presence check above is value-blind by design, so it passes on a
      # truncated or mangled key and the mint then fails as an opaque "Invalid keyData". This step
      # classifies the MATERIAL first and fails by name, before any token can exist. It runs AFTER the
      # job predicate and BEFORE the mint, so an untrusted event still reaches neither. The key crosses
      # as an environment value, never an expression inside the shell; the program prints only
      # KEY_PREFLIGHT=<CODE> and a fixed remedy — never the key, its body, or its length.
      - name: Preflight the App private key (classification only — the key is never printed)
        id: key_preflight
        env:
          MWA_APP_KEY_MATERIAL: ${{ secrets.MWA_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node -e "const{createPrivateKey,webcrypto}=require(\"crypto\");const CODES={PASS:\"PASS\",FAIL_MISSING_BOUNDARY:\"FAIL_MISSING_BOUNDARY\",FAIL_TRUNCATED_OR_INVALID:\"FAIL_TRUNCATED_OR_INVALID\",FAIL_IMPORT:\"FAIL_IMPORT\",FAIL_ABSENT:\"FAIL_ABSENT\"};const REMEDY={FAIL_ABSENT:\"The App private-key secret is empty or unset. Configure it before this workflow can mint a token.\",FAIL_MISSING_BOUNDARY:\"The stored value has no BEGIN/END PRIVATE KEY boundary lines. Store the complete PEM exactly as issued, including both boundary lines and every newline.\",FAIL_TRUNCATED_OR_INVALID:\"The stored value is incomplete or not a valid PEM key. This is what a truncated paste looks like. Re-enter the secret by streaming the key file straight into the secret store rather than pasting it, so nothing can be cut.\",FAIL_IMPORT:\"The key parsed but could not be imported as an RSA signing key. Confirm the file is the App private key issued by GitHub and has not been converted or re-encoded.\"};async function classify(text){if(!text||!text.trim())return CODES.FAIL_ABSENT;if(!/-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/.test(text)||!/-----END [A-Z0-9 ]*PRIVATE KEY-----/.test(text))return CODES.FAIL_MISSING_BOUNDARY;const body=text.replace(/-----(BEGIN|END)[^-]*-----/g,\"\").replace(/\\s+/g,\"\");if(!body)return CODES.FAIL_TRUNCATED_OR_INVALID;let d;try{d=createPrivateKey(text).export({type:\"pkcs8\",format:\"der\"});}catch(e){return CODES.FAIL_TRUNCATED_OR_INVALID;}try{await webcrypto.subtle.importKey(\"pkcs8\",d,{name:\"RSASSA-PKCS1-v1_5\",hash:\"SHA-256\"},false,[\"sign\"]);}catch(e){return CODES.FAIL_IMPORT;}return CODES.PASS;}classify(process.env.MWA_APP_KEY_MATERIAL).then(code=>{console.log(\"KEY_PREFLIGHT=\"+code);if(code!==CODES.PASS){console.log(\"::error::App private key preflight failed (\"+code+\"). \"+REMEDY[code]);process.exit(6);}});"

      - name: Mint short-lived App token — Contents:Read on the central repository only
        id: mwa_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MWA_APP_ID }}
          private-key: ${{ secrets.MWA_APP_PRIVATE_KEY }}
          owner: Waheebow
          repositories: maqaleed-web-assurance

      - name: Checkout central assurance at the immutable pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.MWA_A1_REPO }}
          ref: ${{ env.MWA_A1_RUNNER_REF }}
          path: .mwa-a1
          token: ${{ steps.mwa_token.outputs.token }}
          persist-credentials: false

      - name: Prove the pin resolved to the exact commit requested
        working-directory: .mwa-a1
        env:
          WANT: ${{ env.MWA_A1_RUNNER_REF }}
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          echo "ASSURANCE_RUNNER_PIN=$GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::runner pin mismatch — wanted $WANT got $GOT"
            exit 7
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }

      - name: Install central runner dependencies (no lifecycle scripts)
        working-directory: .mwa-a1
        run: npm ci --ignore-scripts

      - name: Central runner self-check — refuse to observe with a runner that fails its own tests
        working-directory: .mwa-a1
        run: |
          set -euo pipefail
          shasum -a 256 -c SHA256SUMS.txt
          npm run test:a1

      - name: Run A1 against this commit
        env:
          PRODUCT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node .mwa-a1/adapters/products/a1-ci.js \
            --product "$MWA_A1_PRODUCT" \
            --sha "$PRODUCT_SHA" \
            --product-path . \
            --out a1-runs \
            --runner-pin "$MWA_A1_RUNNER_REF" | tee a1-summary.json

      - name: Verify the sealed bundle
        run: |
          set -euo pipefail
          # The runner reports its own output directory; deriving it by globbing
          # would pick the wrong bundle if a previous run left one behind.
          dir="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("a1-summary.json","utf8")).dir)')"
          test -n "$dir"
          cd "$dir"
          shasum -a 256 -c SHA256SUMS.txt
          echo "A1_SEAL=PASS"

      - name: Upload sealed A1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-assurance-${{ github.run_id }}
          path: |
            a1-runs/
            a1-summary.json
          if-no-files-found: error
          retention-days: 90
