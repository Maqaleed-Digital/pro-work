name: web-assurance
on:
  workflow_dispatch:
    inputs:
      url_override: { description: "DIAGNOSTIC ONLY: observe this https URL instead of the canonical surface", required: false }
  workflow_run:
    workflows: ["Production Deployment"]
    types: [completed]

env:
  MWA_ADAPTER_MODE: production
  MWA_REPO: Waheebow/maqaleed-web-assurance
  MWA_RUNNER_REF: b7014321335628d7be7d89631dae1219034658ae # v0.1.1
  MWA_EVIDENCE_BRANCH: evidence/baselines-v1

permissions:
  contents: read

concurrency:
  group: web-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == 'Maqaleed-Digital/pro-work' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.name == 'Production Deployment')
