          set -euo pipefail
          node .mwa/bin/mwa.js run --manifest "$MWA_MANIFEST" --out assurance-runs \
            --trigger "$MWA_TRIGGER" --commit-sha "$MWA_COMMIT" \
            --deployment-id "$MWA_DEPLOY_ID" --previous "$MWA_PREVIOUS" | tee "$RUNNER_TEMP/mwa-run.log"
          DIR="$(sed -n 's/^SEALED //p' "$RUNNER_TEMP/mwa-run.log" | tail -n 1)"
