        id: observe
        env:
          MWA_MANIFEST: ${{ steps.manifest.outputs.path }}
          MWA_TRIGGER: ${{ steps.t.outputs.trigger }}
          MWA_COMMIT: ${{ github.sha }}
          MWA_DEPLOY_ID: ${{ github.event.workflow_run.id || github.run_id }}
          MWA_PREVIOUS: ${{ steps.base.outputs.dir }}
