        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Controls (no network) — hard stop if detectors do not fire as declared
        working-directory: .mwa
        run: node bin/mwa.js controls

      # The automatic path reads NO URL from the event: it observes the canonical surface in assurance/surface.yaml.
      - name: Resolve target + trigger
        id: t
        env:
          EV_EVENT_NAME: ${{ github.event_name }}
          EV_URL_OVERRIDE: ${{ github.event.inputs.url_override }}
        run: |
          set -euo pipefail
          URL=""
          case "${EV_EVENT_NAME:-}" in
            workflow_run) TRIG=production-deploy ;;
            workflow_dispatch)
              TRIG=manual
