        run: |
          DELTA_PATH="$RUN_DIR/delta.json" node -e "const d=require(require('path').resolve(process.env.DELTA_PATH));for(const r of d.attention)console.log('::warning title=web-assurance '+r.state+'::'+r.gate_id+' '+JSON.stringify(r.codes||''));for(const r of d.fixed)console.log('::notice title=web-assurance FIXED::'+r.gate_id);console.log('attention='+d.attention.length+' fixed='+d.fixed.length+' known_fail='+(d.summary.KNOWN_FAIL||0))"

