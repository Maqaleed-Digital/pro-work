        id: mwa_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MWA_APP_ID }}
          private-key: ${{ secrets.MWA_APP_PRIVATE_KEY }}
          owner: Waheebow
          repositories: maqaleed-web-assurance
          permission-contents: read

      - name: Checkout central runner @ pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.MWA_REPO }}
          ref: ${{ env.MWA_RUNNER_REF }}
          path: .mwa
          token: ${{ steps.mwa_token.outputs.token }}
          persist-credentials: false

