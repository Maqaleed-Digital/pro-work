name: prowork-doctor

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Start server
        working-directory: app
        run: node server.js &
        env:
          APP_PORT: 3010

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:3010/api/admin/health >/dev/null 2>&1 && break
            sleep 1
          done

      - name: ProWork Doctor
        shell: bash
        run: |
          chmod +x "scripts/prowork_doctor.sh"
          bash "scripts/prowork_doctor.sh"
