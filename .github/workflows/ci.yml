name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # BRD A6: builds fail if translation keys missing — S36-G5 HARD BUILD GATE
      - name: Verify translations
        working-directory: .
        run: node scripts/i18n/check-translations.js

      - name: Test
        run: npm test

      - name: Config validate smoke
        run: |
          result=0
          NODE_ENV=production node -e \
            "require('./config/validate').validateProductionConfig()" 2>&1 || result=$?
          [ "$result" -ne 0 ] || { echo "ERROR: should have rejected missing vars" >&2; exit 1; }
          echo "CONFIG_VALIDATE: correctly rejected missing production vars"
          NODE_ENV=development node -e \
            "require('./config/validate').validateProductionConfig(); console.log('dev skip: ok')"

      - name: Backup script smoke
        run: |
          TMPBK="$(mktemp -d)"
          BACKUP_DEST="$TMPBK" bash ../scripts/backup_data.sh
          ls "$TMPBK"/*.tar.gz
          ls "$TMPBK"/*.sha256
          ls "$TMPBK"/*.manifest.json
          echo "BACKUP_SMOKE: ok"
          rm -rf "$TMPBK"

      - name: Smoke – health + ready probes
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            sleep 1
            curl -sf http://127.0.0.1:3010/api/health >/dev/null 2>&1 && break
          done
          curl -sf http://127.0.0.1:3010/api/health | grep '"status"'
          curl -sf http://127.0.0.1:3010/api/ready  | grep '"status"'
          kill $SERVER_PID || true
        env:
          NODE_ENV: test
          APP_PORT: "3010"
