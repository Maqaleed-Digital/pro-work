name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # BRD A6: builds fail if translation keys missing — S36-G5 HARD BUILD GATE
      - name: Verify translations
        working-directory: .
        run: node scripts/i18n/check-translations.js

      - name: Test
        run: npm test

      # ── Gate assertion suites ──────────────────────────────────────────────
      # `npm test` above resolves to app/package.json's
      # "node --test frontend/src/components/__tests__/" — three component files.
      # The repository's GATE assertions live in the root tests/ directory and no
      # CI job ran them: tests/cwv.ci_gate.test.js, tests/wcag.ci_gate.test.js and
      # the security-header suites all passed locally while proving nothing about
      # any pushed commit.
      #
      # scripts/ci_gate_tests.js runs a declared manifest of those suites and
      # refuses to exit 0 unless it can show a non-zero assertion set actually ran
      # (a missing gate file fails the build rather than silently skipping).
      # Static rule: no ${{ }} expression may sit inside a run: block. A GitHub
      # expression is substituted before bash parses the script, so event text
      # placed there is shell SOURCE, not data. actionlint does not catch this
      # for deployment_status/deployment/dispatch-input paths — verified 7 Sep
      # 2026 with actionlint 1.7.7 — so this guard runs in addition to it.
      - name: Workflow shell-injection guard
        working-directory: .
        run: node scripts/workflow_injection_guard.js

      # actionlint runs alongside the bespoke guard, not instead of it. PR #70's
      # description claimed both already ran here; only the guard did. Corrected.
      - name: Install actionlint
        working-directory: .
        run: |
          VER=1.7.7
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: actionlint
        working-directory: .
        run: actionlint

      # Proves actionlint's injection check is switched on, and re-measures the
      # documented coverage gap that justifies keeping the bespoke guard.
      - name: Scanner positive controls — actionlint
        working-directory: .
        run: node scripts/scanner_positive_controls.js actionlint

      - name: Gate assertion suites — fails on zero tests run
        working-directory: .
        run: node scripts/ci_gate_tests.js

      - name: Config validate smoke
        run: |
          result=0
          NODE_ENV=production node -e \
            "require('./config/validate').validateProductionConfig()" 2>&1 || result=$?
          [ "$result" -ne 0 ] || { echo "ERROR: should have rejected missing vars" >&2; exit 1; }
          echo "CONFIG_VALIDATE: correctly rejected missing production vars"
          NODE_ENV=development node -e \
            "require('./config/validate').validateProductionConfig(); console.log('dev skip: ok')"

      - name: Backup script smoke
        run: |
          TMPBK="$(mktemp -d)"
          BACKUP_DEST="$TMPBK" bash ../scripts/backup_data.sh
          ls "$TMPBK"/*.tar.gz
          ls "$TMPBK"/*.sha256
          ls "$TMPBK"/*.manifest.json
          echo "BACKUP_SMOKE: ok"
          rm -rf "$TMPBK"

      - name: Smoke – health + ready probes
        run: |
          node server.js &
          SERVER_PID=$!
          for _ in $(seq 1 15); do
            sleep 1
            curl -sf http://127.0.0.1:3010/api/health >/dev/null 2>&1 && break
          done
          curl -sf http://127.0.0.1:3010/api/health | grep '"status"'
          curl -sf http://127.0.0.1:3010/api/ready  | grep '"status"'
          kill $SERVER_PID || true
        env:
          NODE_ENV: test
          APP_PORT: "3010"

  # ── WCAG 2.2 AA Accessibility Gate ────────────────────────────────────────
  # BRD A6 + Maqaleed Eval required
  # Runs AFTER build, BEFORE deploy.
  # Exit code 1 on ANY critical violation — blocks deploy pipeline.
  # Checks WCAG 2.2 criteria: 2.4.11 Focus Appearance, 2.5.8 Target Size.
  wcag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs after app job succeeds — ensures code quality gate is met first
    needs: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root deps (puppeteer + axe)
        run: npm ci
        # puppeteer auto-downloads Chromium on install

      - name: Setup frontend preview deps
        run: cd app/frontend && npm ci

      - name: Build frontend
        # WCAG audit runs against the BUILT frontend, not source — catches
        # any build-time transformation issues that affect accessibility
        run: npm run build:ui

      - name: Start vite preview server
        run: |
          cd app/frontend
          npx vite preview --port 4173 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          # Wait for preview server to be ready
          for _ in $(seq 1 15); do
            sleep 1
            curl -sf http://localhost:4173 >/dev/null 2>&1 && break
          done
          echo "Preview server ready"

      - name: Run WCAG 2.2 AA audit — EXIT 1 on critical violation
        # BRD A6 + Maqaleed Eval required
        # This step BLOCKS deploy if any critical/serious violation is found.
        # Routes audited: / /ai /workforce /compliance /evidence
        #                 /payments /admin /programs /identity (9 total)
        run: node scripts/wcag_audit.js
        env:
          AUDIT_URL: "http://localhost:4173"
          AUDIT_CI_TOKEN: "ci-wcag-token"

      - name: Upload accessibility report
        if: always()   # upload even on failure — needed for violation review
        uses: actions/upload-artifact@v4
        with:
          name: wcag-accessibility-report
          path: reports/accessibility/
          retention-days: 30

      - name: Stop preview server
        if: always()
        run: kill "$PREVIEW_PID" 2>/dev/null || true

  # ── Core Web Vitals Budget Gate ───────────────────────────────────────────
  # BRD A6 + Maqaleed Eval required
  # Runs AFTER wcag job, BEFORE deploy.
  # EXIT 1 if any critical route: LCP > 4s OR INP > 500ms OR CLS > 0.25
  # Budget thresholds in app/frontend/src/performance-budget.json
  # Budget file changes require PR review — see file comment.
  cwv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs after wcag job — deploy pipeline: app → wcag → cwv → deploy
    needs: wcag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Setup frontend preview deps
        run: cd app/frontend && npm ci

      - name: Build frontend
        # CWV audit runs against BUILT bundle — bundle size determines estimated LCP
        run: npm run build:ui

      - name: Start vite preview server
        run: |
          cd app/frontend
          npx vite preview --port 4173 &
          echo "CWV_PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 15); do
            sleep 1
            curl -sf http://localhost:4173 >/dev/null 2>&1 && break
          done
          echo "CWV preview server ready"

      - name: Run CWV budget audit — EXIT 1 if LCP > 4s / INP > 500ms / CLS > 0.25
        # BRD A6 + Maqaleed Eval required
        # --lighthouse: real Lighthouse measurement using pre-installed Chrome.
        # `lighthouse` and `chrome-launcher` are declared devDependencies — they
        # were not, so every run of this job since it was added failed with
        # "Cannot find module 'lighthouse'" reported as 12 budget violations.
        # Audits 4 critical routes: / /ai /workforce /compliance
        # The runner exits 1 if it cannot show a full 12-assertion set was run.
        run: node scripts/cwv_audit.js --lighthouse
        env:
          AUDIT_URL: "http://localhost:4173"

      - name: Upload performance report
        if: always()   # upload even on failure — needed for budget review
        uses: actions/upload-artifact@v4
        with:
          name: cwv-performance-report
          path: reports/performance/
          retention-days: 30

      - name: Stop preview server
        if: always()
        run: kill "$CWV_PREVIEW_PID" 2>/dev/null || true
