name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Smoke – health + ready probes
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            sleep 1
            curl -sf http://127.0.0.1:3010/api/health >/dev/null 2>&1 && break
          done
          curl -sf http://127.0.0.1:3010/api/health | grep '"status"'
          curl -sf http://127.0.0.1:3010/api/ready  | grep '"status"'
          kill $SERVER_PID || true
        env:
          NODE_ENV: test
          APP_PORT: "3010"
