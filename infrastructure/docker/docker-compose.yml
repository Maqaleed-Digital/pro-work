services:
  postgres:
    image: postgres:16-alpine
    container_name: prowork-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prowork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prowork_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-prowork}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prowork}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prowork-network

  redis:
    image: redis:7-alpine
    container_name: prowork-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-prowork_redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prowork-network

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: prowork-api
    user: "0:0"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3010
      PORT: ${API_PORT:-3010}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-prowork}:${POSTGRES_PASSWORD:-prowork_secure_password}@postgres:5432/${POSTGRES_DB:-prowork}
      REDIS_URL: redis://:${REDIS_PASSWORD:-prowork_redis_pass}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      PROWORK_DATA_DIR: /data/prowork
    volumes:
      - prowork_data:/data/prowork
    ports:
      - "${API_PORT:-3010}:3010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3010/api/admin/health || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ]"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - prowork-network

  admin-console:
    build:
      context: ../../admin-console
      dockerfile: Dockerfile
    container_name: prowork-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3010
      NODE_ENV: production
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    networks:
      - prowork-network

  trust-explorer:
    build:
      context: ../../trust-explorer
      dockerfile: Dockerfile
    container_name: prowork-explorer
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3010
      NODE_ENV: production
    ports:
      - "${EXPLORER_PORT:-3002}:3000"
    networks:
      - prowork-network

  nginx:
    image: nginx:alpine
    container_name: prowork-nginx
    restart: unless-stopped
    depends_on:
      - api
      - admin-console
      - trust-explorer
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - prowork-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prowork-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - prowork-network

  grafana:
    image: grafana/grafana:latest
    container_name: prowork-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    networks:
      - prowork-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  prowork_data:

networks:
  prowork-network:
    driver: bridge
