apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${WC_PROD_SERVICE_NAME}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${WC_PROD_MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "${WC_PROD_MAX_INSTANCES}"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: ${WC_PROD_CONCURRENCY}
      timeoutSeconds: ${WC_PROD_TIMEOUT_SECONDS}
      containers:
        - image: ${WC_PROD_IMAGE_URI}
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: WC_RUNTIME_ENV
              value: ${WC_PROD_ENVIRONMENT}
            - name: PORT
              value: "3000"
            - name: WC_PROD_BASE_URL
              value: ${WC_PROD_BASE_URL}
            - name: WC_PROD_API_KEY_SEED_VERSION
              value: ${WC_PROD_API_KEY_SEED_VERSION}
          resources:
            limits:
              cpu: ${WC_PROD_CPU}
              memory: ${WC_PROD_MEMORY}
