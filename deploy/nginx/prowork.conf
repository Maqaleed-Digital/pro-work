# deploy/nginx/prowork.conf
# HTTP-only starter — run certbot to add TLS automatically:
#   sudo certbot --nginx -d prowork.yourdomain.com
# Certbot will add ssl_certificate, ssl_protocols, and HTTP→HTTPS redirect.
# Replace server_name with your actual domain before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name prowork.yourdomain.com;  # replace with your domain

    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }

    # Silence health probe access logs to reduce noise
    location = /api/health {
        proxy_pass http://127.0.0.1:3010;
        access_log off;
    }

    location = /api/ready {
        proxy_pass http://127.0.0.1:3010;
        access_log off;
    }
}
