# deploy/nginx/prowork.conf
# Nginx reverse proxy: TLS terminates here, forwards to Node.js on 127.0.0.1:3010.
# Replace server_name and ssl_certificate paths for your domain.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # replace with your domain, e.g. prowork.example.com

    ssl_certificate     /etc/ssl/certs/prowork.crt;
    ssl_certificate_key /etc/ssl/private/prowork.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (31536000s = 1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Node.js
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }

    # Silence health probe access logs to reduce noise
    location = /api/health {
        proxy_pass http://127.0.0.1:3010;
        access_log off;
    }

    location = /api/ready {
        proxy_pass http://127.0.0.1:3010;
        access_log off;
    }
}
