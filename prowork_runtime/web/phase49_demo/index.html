<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 49 — Delivery Evidence</title>
  <link rel="stylesheet" href="/phase49-demo/styles.css" />
</head>
<body>
  <header>
    <h1>Phase 49 — Delivery Evidence</h1>
    <p class="subtitle">Output Artifact Activation</p>
  </header>
  <main>
    <section class="card">
      <h2>Setup: Intake → Approve → Work Item → Complete</h2>
      <button id="btn-setup">Run Governed Setup</button>
      <pre id="out-setup"></pre>
    </section>

    <section class="card">
      <h2>Create Delivery Artifact</h2>
      <input id="in-title" placeholder="title" value="Execution closure pack" />
      <input id="in-summary" placeholder="summary" value="Capture the completed execution output as a governed delivery artifact" />
      <input id="in-type" placeholder="artifactType" value="CLOSURE_PACK" />
      <button id="btn-delivery">Create Delivery Artifact</button>
      <pre id="out-delivery"></pre>
    </section>

    <section class="card">
      <h2>Live State</h2>
      <button id="btn-refresh">Refresh</button>
      <pre id="out-state"></pre>
      <pre id="out-artifacts"></pre>
    </section>

    <section class="card">
      <h2>Events</h2>
      <button id="btn-events">Fetch Events</button>
      <pre id="out-events"></pre>
    </section>
  </main>
  <script src="/phase49-demo/app.js"></script>
</body>
</html>
