<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Assurance Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #020617; color: #e2e8f0; margin: 0; padding: 24px; }
    h1 { font-size: 1.4rem; color: #f1f5f9; }
    button { background: #4f46e5; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 0.875rem; }
    button:hover { background: #4338ca; }
    pre { background: #111827; border: 1px solid #334155; border-radius: 8px; padding: 16px; font-size: 0.8rem; color: #94a3b8; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Board Assurance Dashboard — Phase 52</h1>
  <button onclick="load()">Load Assurance Data</button>
  <pre id="out">Click button to load data...</pre>

  <script>
    async function load() {
      const res = await fetch("/api/board/assurance");
      const data = await res.json();
      document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
