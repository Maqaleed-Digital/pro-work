<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WorkCaptain Phase 51 Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/phase51-demo/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>WorkCaptain / ProWork — Phase 51</h1>
        <p>Audit Export + Governed Closure Certification Activation</p>
      </section>

      <section class="card">
        <h2>Create Closure Certification</h2>
        <form id="cert-form">
          <label>Evidence Pack ID <input id="epId" placeholder="evidencepack_..." /></label>
          <label>Title <input name="title" value="Closure certification record" /></label>
          <label>Summary <textarea name="summary">Capture the first governed closure certification from an evidence pack.</textarea></label>
          <label>Certification Type <input name="certificationType" value="BOARD_ASSURANCE" /></label>
          <label>Actor ID <input id="actorId" value="board_ops_001" /></label>
          <label>Actor Role
            <select id="actorRole">
              <option value="board_operator">board_operator</option>
              <option value="requester">requester</option>
            </select>
          </label>
          <button type="submit">Create certification</button>
        </form>
        <pre id="cert-result">Waiting...</pre>
      </section>

      <section class="card">
        <h2>Live Runtime State</h2>
        <button id="refresh">Refresh live state</button>
        <pre id="command-state">Loading...</pre>
        <pre id="certification-detail">Loading...</pre>
        <pre id="audit-export">Loading...</pre>
        <pre id="events-list">Loading...</pre>
      </section>
    </main>
    <script src="/phase51-demo/app.js"></script>
  </body>
</html>
